name: CI

on:
  pull_request: # development/mainにマージされる前に走らせる
    branches: [development, main]
  push: # developmentではCIのみ、mainではdeployのworkflow_runトリガーにもなる
    branches: [development, main]

# 書かなかった権限は none になる。非公開リポジトリでは contents: read がないと checkout できない（T6-7）
permissions:
  contents: read

jobs:
  # ── Phase 1: 軽量チェック（並列）────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:                           # 1ステップ = 1コマンド or 1アクション
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 / 1. コードをCI環境にコピーする
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 / 2. node本体をinstall
        with:
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 / 3. keyに紐づくキャッシュデータがあれば取得, なかったらjob終了後に(あれば)保存
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }} #キャッシュのkey(これを下に探索する)
      - run: npm ci                   # 4. cacheがなかったら npm ci で依存パッケージをinstall
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm run lint             # 5. lint実行

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npx tsc --noEmit

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm run audit:ci # high 以上で例外リスト（scripts/ci/auditAllowlist.ts）にないものがあれば失敗

  # 秘密情報の検査（T8-1）。GitHub の Secret scanning は非公開リポジトリでは使えないので、その代わり
  # サードパーティの action を増やさないよう、本体をバージョン固定でダウンロードし、チェックサムを確かめて実行する
  # 毎回すべての履歴を検査する（数秒で終わる）。誤検知は .gitleaksignore に Fingerprint で除外する
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_checksums.txt の linux_x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # 全履歴を取得する（既定の 1 だと最新のコミットしか検査できない）
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
      - name: Run gitleaks
        run: ${{ runner.temp }}/gitleaks git --redact --no-banner -v . # --redact: 見つかった値をログに出さない

  # ── Phase 2: ユニットテスト（Phase 1 通過後）────────────────────────────
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck, audit, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm run test
      - run: npm run test:tz          # tests/time/ を TZ=UTC / Asia/Tokyo / America/Los_Angeles で実行（docs/BugHunting.md §3.4）

  # ── Phase 3: 重いテスト（unit-test 通過後）──────────────────────────────
  # Firestore Emulator に実際に書いて読む往復検査（tests/emulator/、docs/BugHunting.md §3.1）
  # Firebase CLI は依存（package.json）に入れず、ここでだけグローバルに入れる（npm audit の対象を増やさない）
  emulator-test:
    name: Emulator Round-trip Test
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 / Firestore Emulator は Java で動く
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm install -g firebase-tools@15.34.1 # バージョンを固定する（公開から7日以上たったもの。T6-6）
      - run: npm run test:emulator    # firebase emulators:exec で専用の Emulator を起動してから vitest を実行

  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npx playwright install --with-deps chromium
      # 開発サーバーの環境変数（Emulator 系・demo project・ダミーの API キー）は
      # playwright.config.ts の webServer.env に集約し、ローカルと同じ設定で起動する
      - run: npm run e2e
      - name: Upload playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: [unit-test]
    permissions:
      contents: read
      issues: write   # ZAP の action が結果を Issue に書く
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build Next.js
        run: npm run build
      - name: Start server
        run: npm run start &                                   # ローカルでアプリ起動（http://localhost:3000）
      - name: Wait for server
        # サーバーが立ち上がるまで最大60秒待つ。npx wait-on は実行のたびに最新版を取得するので、curl で依存をなくした（T6-6）
        # / は /login へのリダイレクト（3xx）を返す。-f は 4xx・5xx だけを失敗にする
        run: timeout 60 bash -c 'until curl -fs -o /dev/null http://localhost:3000; do sleep 1; done'
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0 / zapを実行
        with:
          target: http://localhost:3000/login
          fail_action: warn
          # Dependabot の PR では GITHUB_TOKEN が読み取り専用で Issue を書けないので、書かない（結果は artifact に残る）
          allow_issue_writing: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
