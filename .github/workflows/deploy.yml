name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["CI"] # ci.yml の name: と一致
    types: [completed]
    branches: [main]

env:
  REGION: asia-northeast1
  SERVICE: ryokan-system
  REGISTRY: asia-northeast1-docker.pkg.dev
  REPO: ryokan   # Artifact Registry のリポジトリ名
  RUNTIME_SA_NAME: ryokan-runtime # Cloud Run の実行用の SA（Firestore と Firebase Auth に必要な権限だけ。T6-1、GCP_SETUP.md §5）

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # push で動いた CI が成功したときだけデプロイする（PR の CI では動かさない。T6-8）
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation に必要

    steps:
      # CI が検査したコミットを取得する。workflow_run の github.sha は「deploy が始まった時点の main の最新」で、
      # CI のあとに push されたコミットを指すことがあるため、head_sha を使う（T6-8）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 / ソースコードを取得
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Workload Identity Federation で GCP に認証（キーファイル不要）
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 / GCP認証
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      # Artifact Registry への docker push を許可
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # Docker イメージのビルド & プッシュ（GHA キャッシュで高速化）
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 / DockerBuild
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2 / GCPにpush(upload)
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.event.workflow_run.head_sha }}
          # NEXT_PUBLIC_ はビルド時に埋め込まれるため build-args で渡す
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cloud Run へデプロイ
      - uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6 / 作ったDockerImageをCloudRunに乗せる
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.event.workflow_run.head_sha }}
          # サーバーサイド専用の環境変数（Firebase Admin は ADC で自動認証、NEXT_PUBLIC_ 不要）
          env_vars: |
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          # 公開の設定（allUsers に run.invoker）はサービスに付いたまま残るので、デプロイのたびには渡さない。
          # デプロイ用の SA は run.developer で、公開の設定を変えられない（T5-4、GCP_SETUP.md §4）
          flags: --service-account=${{ env.RUNTIME_SA_NAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
