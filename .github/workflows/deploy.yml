name: Deploy to Cloud Run

on:
  # workflow_run は、PR（フォークを含む）の CI の完了でも動き、その権限で PR のコードを扱うと乗っ取られる（zizmor の dangerous-triggers）。
  # ここでは jobs.deploy.if: で「main への push の CI が成功したとき」に限り、checkout するのはその CI が検査した main のコミット（head_sha）。
  # ジョブに分けて ci.yml に入れない理由: WIF の属性条件が「main の deploy.yml」だけに GCP への認証を許しているため（docs/Security.md §7）
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"] # ci.yml の name: と一致
    types: [completed]
    branches: [main]

env:
  REGION: asia-northeast1
  SERVICE: ryokan-system
  REGISTRY: asia-northeast1-docker.pkg.dev
  REPO: ryokan   # Artifact Registry のリポジトリ名
  RUNTIME_SA_NAME: ryokan-runtime # Cloud Run の実行用の SA（Firestore と Firebase Auth に必要な権限だけ）

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # push で動いた CI が成功したときだけデプロイする（PR の CI では動かさない）
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation に必要

    steps:
      # CI が検査したコミットを取得する。workflow_run の github.sha は「deploy が始まった時点の main の最新」で、
      # CI のあとに push されたコミットを指すことがあるため、head_sha を使う
      # Semgrep は「workflow_run で PR のコードを checkout している」と指摘するが、上の if: で main への push の CI に限っているので、
      # head_sha は main のコミットで、PR のコードではない（誤検知）
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / ソースコードを取得
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false # Git の認証情報を残さない（push しない）

      # Workload Identity Federation で GCP に認証（キーファイル不要）
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 / GCP認証
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      # Artifact Registry への docker push を許可
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # Docker イメージのビルド & プッシュ（GHA キャッシュで高速化）
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 / DockerBuild
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 / GCPにpush(upload)
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.event.workflow_run.head_sha }}
          # ブラウザは Firebase を呼ばないので、ビルド時に埋め込む NEXT_PUBLIC_ の変数（build-args）はない
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cloud Run へデプロイ
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1 / 作ったDockerImageをCloudRunに乗せる
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.event.workflow_run.head_sha }}
          # サーバーサイド専用の環境変数（Firebase Admin は ADC で自動認証、NEXT_PUBLIC_ 不要）
          env_vars: |
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          # パスワードの確認（src/infra/auth/passwordSignIn.ts）に使う API キー。Identity Toolkit API だけに絞ったもの。
          # Secret Manager から実行時に渡す（実行用の SA に roles/secretmanager.secretAccessor が要る。docs/Development.md）
          secrets: |
            FIREBASE_AUTH_API_KEY=firebase-auth-api-key:latest
          # 公開の設定（allUsers に run.invoker）はサービスに付いたまま残るので、デプロイのたびには渡さない。
          # デプロイ用の SA は run.developer で、公開の設定を変えられない
          flags: --service-account=${{ env.RUNTIME_SA_NAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
