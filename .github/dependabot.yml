# Dependabot の通常の更新（T6-3。docs/CICD.md「Dependabot」）
# - PR は development 宛て（feature → development → main の流れに乗せる）
# - セキュリティ更新の自動 PR は main 宛てにしか作れないので使わない（Settings で無効。警告だけ受け取り、development で直す）
# - 公開から7日待つ（.npmrc の min-release-age=7 と揃える）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "development"
    # 既定の5件だと、上限に達して作られない PR が出る（見逃さないよう多めにする）
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    groups:
      # minor と patch はまとめて1つの PR にする。major は1つずつ（変更点を確かめる）
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Node の型は実行環境（Node 24）の major に合わせる。Node を上げるときに手で上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    # 既定の5件だと、上限に達して作られない PR が出る（見逃さないよう多めにする）
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    groups:
      # SHA と行末のバージョンのコメントを一緒に書き換える。major も含めてまとめる
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "development"
    # 既定の5件だと、上限に達して作られない PR が出る（見逃さないよう多めにする）
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    ignore:
      # Node の major（26 など）は手で上げる（docs/Security/SecurityPolicy.md §8「後回しにしたもの」）
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
